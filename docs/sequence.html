<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨库事务时序图</title>
<style>
  body{margin:0;padding:16px;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#fff;}
  svg{max-width:1200px;width:100%;height:auto;display:block;margin:0 auto;}
</style>
</head>
<body>
<div style="max-width:1200px;margin:0 auto;">
  <div style="text-align:center;font-size:20px;font-weight:700;color:#0f172a;margin-bottom:4px;">跨库交易时序：正向提交 + 故障自愈（示意）</div>
  <div style="text-align:center;font-size:12.5px;color:#64748b;margin-bottom:8px;">业务代码只调网关；执行器按状态机驱动；SHOP 宕机期间补偿挂起，节点重启后自检自治回滚</div>
  <svg viewBox="0 0 1200 1000">
    <defs>
      <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
      <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/></marker>
      <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    </defs>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="30" y="10" width="120" height="40" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="90" y="35" fill="#92400e">业务/网关</text>
      <rect x="230" y="10" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="290" y="35" fill="#1d4ed8">执行器</text>
      <rect x="430" y="10" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="490" y="35" fill="#15803d">USER节点</text>
      <rect x="630" y="10" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="690" y="35" fill="#15803d">SHOP节点</text>
      <rect x="840" y="10" width="120" height="40" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="900" y="35" fill="#b91c1c">TXN节点</text>
      <rect x="1030" y="10" width="140" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="1100" y="35" fill="#475569">轮询/死信</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4">
      <line x1="90" y1="50" x2="90" y2="960"/><line x1="290" y1="50" x2="290" y2="960"/>
      <line x1="490" y1="50" x2="490" y2="960"/><line x1="690" y1="50" x2="690" y2="960"/>
      <line x1="900" y1="50" x2="900" y2="960"/><line x1="1100" y1="50" x2="1100" y2="960"/>
    </g>
    <rect x="20" y="62" width="1160" height="26" rx="6" fill="#eff6ff"/>
    <text x="600" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">A. 正常正向：预冻结 → FROZEN → 分步提交 → SUCCESS</text>
    <g font-size="11.5" fill="#1f2937">
      <line x1="90" y1="104" x2="285" y2="104" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="187" y="99" text-anchor="middle">order(user,merchant,qty,amount) + 幂等号</text>
      <line x1="290" y1="132" x2="895" y2="132" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="592" y="127" text-anchor="middle">create 事务(INIT) · 全局事务ID</text>
      <line x1="290" y1="160" x2="485" y2="160" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="387" y="155" text-anchor="middle">freeze 余额(标记,不扣值)</text>
      <line x1="290" y1="188" x2="685" y2="188" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="487" y="183" text-anchor="middle">freeze 库存(标记,不扣值)</text>
      <line x1="290" y1="216" x2="895" y2="216" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="592" y="211" text-anchor="middle">双方冻结成功 → state=FROZEN</text>
      <line x1="290" y1="244" x2="485" y2="244" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
      <text x="387" y="239" text-anchor="middle">commit 扣真实余额</text>
      <line x1="290" y1="272" x2="685" y2="272" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
      <text x="487" y="267" text-anchor="middle">commit 扣真实库存</text>
      <line x1="290" y1="300" x2="895" y2="300" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
      <text x="592" y="295" text-anchor="middle">全部完成 → state=SUCCESS(终态)</text>
      <line x1="290" y1="328" x2="95" y2="328" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
      <text x="190" y="323" text-anchor="middle">返回成功（对外原子）</text>
    </g>
    <line x1="20" y1="356" x2="1180" y2="356" stroke="#e2e8f0" stroke-width="1.4"/>
    <rect x="20" y="366" width="1160" height="26" rx="6" fill="#fff7ed"/>
    <text x="600" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">B. 故障自愈：SHOP COMMIT 异常 → ROLLBACK；SHOP 宕机补偿挂起 → 重启后自检自治回滚</text>
    <g font-size="11.5" fill="#1f2937">
      <rect x="430" y="398" width="120" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="490" y="413" text-anchor="middle" font-size="10.5" fill="#15803d">USER 已扣值(COMMITTED)</text>
      <rect x="630" y="398" width="120" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
      <text x="690" y="413" text-anchor="middle" font-size="10.5" fill="#b91c1c">SHOP COMMIT 失败</text>
      <line x1="290" y1="436" x2="895" y2="436" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
      <text x="592" y="431" text-anchor="middle" fill="#c2410c">state=ROLLBACK（启动补偿）</text>
      <line x1="290" y1="464" x2="485" y2="464" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
      <text x="387" y="459" text-anchor="middle" fill="#c2410c">refund 返还已扣余额(COMMITTED)</text>
      <line x1="290" y1="492" x2="685" y2="492" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ao)"/>
      <text x="487" y="487" text-anchor="middle" fill="#b91c1c">unfreeze 解冻库存 ← SHOP 已宕机，失败</text>
      <line x1="290" y1="520" x2="895" y2="520" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
      <text x="592" y="515" text-anchor="middle" fill="#c2410c">保持 ROLLBACK + next_retry_at（挂起）</text>
      <line x1="1100" y1="548" x2="895" y2="548" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ao)"/>
      <text x="1000" y="543" text-anchor="middle" fill="#b91c1c">扫非终态→重连 SHOP 仍不可达→退避</text>
    </g>
    <rect x="620" y="566" width="140" height="24" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="690" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">SHOP 进程重启</text>
    <g font-size="11.5" fill="#1f2937">
      <line x1="690" y1="604" x2="900" y2="604" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ao)"/>
      <text x="795" y="599" text-anchor="middle" fill="#c2410c">自检：拉取本库未完成事务</text>
      <line x1="900" y1="632" x2="695" y2="632" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ao)"/>
      <text x="795" y="627" text-anchor="middle" fill="#c2410c">返回 ROLLBACK 事务 + 冻结标记核对</text>
      <rect x="630" y="650" width="120" height="24" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
      <text x="690" y="666" text-anchor="middle" font-size="10.5" fill="#15803d">本地事务:解冻标记</text>
      <line x1="690" y1="688" x2="895" y2="688" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ao)"/>
      <text x="792" y="683" text-anchor="middle" fill="#c2410c">回写 op=COMPENSATED</text>
      <line x1="290" y1="716" x2="895" y2="716" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
      <text x="592" y="711" text-anchor="middle" fill="#15803d">全部步骤已补偿 → state=ROLLED_BACK(终态)</text>
    </g>
    <rect x="40" y="760" width="540" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="56" y="784" font-size="12" font-weight="700" fill="#0f172a">其他分支：</text>
    <text x="56" y="806" font-size="11.5" fill="#475569">· 冻结任一失败 → INIT 直接转 ROLLBACK，已冻结的解冻（库存/余额不变）。</text>
    <text x="56" y="826" font-size="11.5" fill="#475569">· 死信指数退避达上限 → state=MANUAL_REVIEW + 告警，不再无限重试。</text>
    <rect x="620" y="760" width="560" height="86" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="636" y="784" font-size="12" font-weight="700" fill="#92400e">关键不变量：</text>
    <text x="636" y="806" font-size="11.5" fill="#78350f">· 冻结只加标记不扣值；COMMITTED 才扣真实值。</text>
    <text x="636" y="826" font-size="11.5" fill="#78350f">· 补偿按相位：已扣值→返还；仅冻结→只解冻。幂等号保证重试不重复。</text>
    <text x="600" y="900" text-anchor="middle" font-size="11.5" fill="#64748b">蓝色=正向调用，绿色=已生效/终态，橙色=补偿与回写，红色=故障/退避，虚线=节点重启后自治自检回查</text>
    <text x="600" y="922" text-anchor="middle" font-size="11" fill="#94a3b8">示意：实际节点为独立进程，HTTP/JSON 互连；USER/SHOP 库之间无任何连线。</text>
  </svg>
</div>
</body>
</html>
